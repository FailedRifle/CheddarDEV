<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AndreajnRcm4/b398dl2h74v@9a23fbb2373d743a564873251cbb57736ebc1f73/style.css" type="text/css" />
    <title>learn to fly 3</title>
    <style>
        *, html, body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        object, embed {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        #sidebarad1,
        #sidebarad2 {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 600px;
            padding: 0;
            margin: 0;
            z-index: 999999;
        }
        #sidebarad1 { left: 0; }
        #sidebarad2 { right: 0; }
        .sidebar-close {
            position: absolute;
            top: 0;
            right: 0;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }
        .sidebar-frame {
            width: 160px;
            height: 600px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/gh/u-cvlassrom-y/google@main/ruffle.js"></script>
    <object width="100%" height="100%">
        <param name="movie" value="https://cdn.jsdelivr.net/gh/Magixxz/embeds@a9ae99acf7e9feb974b973c9331282ae025754ce/Learn-To-Fly-3.swf">
        <param name="allowFullScreen" value="true">
        <param name="allowScriptAccess" value="always">
        <embed src="https://cdn.jsdelivr.net/gh/Magixxz/embeds@a9ae99acf7e9feb974b973c9331282ae025754ce/Learn-To-Fly-3.swf"
               width="100%" height="100%"
               allowfullscreen="true">
    </object>
</body>
</html>
