<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raft Wars 2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/gh/u-cvlassrom-y/google@main/ruffle.js"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      scale: "showAll",
      salign: "",
      forceScale: true,
      wmode: "transparent",
      allowFullscreen: true,
    };

    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.id = "game";
      document.body.appendChild(player);
      player.style.width  = "100%";
      player.style.height = "100%";
      player.load("https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@03ae5a340e20d61038bf2b7bb749d8ae702183f1/raft-wars-2-14853.swf");
    });
  </script>
</body>
</html>
