<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script src="https://cdn.jsdelivr.net/gh/genizy/assets@main/backrooms/js/main.js"></script>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>backrooms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/genizy/assets@main/backrooms/TemplateData/style.css"/>
    <script src="https://cdn.jsdelivr.net/gh/genizy/assets@main/backrooms/TemplateData/UnityProgress.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/genizy/assets@main/backrooms/Build/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/genizy/assets@main/backrooms/Build/WebGL.json", { onProgress: UnityProgress });
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
      }

      #gameContainer {
        width: 100% !important;
        height: 100% !important;
        position: absolute;
        top: 0;
        left: 0;
      }

      #sidebarad1,
      #sidebarad2 {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 160px;
        height: 600px;
        padding: 0;
        margin: 0;
        z-index: 999999;
      }
      #sidebarad1 {
        left: 0;
      }
      #sidebarad2 {
        right: 0;
      }
      .sidebar-close {
        position: absolute;
        top: 0;
        right: 0;
        width: 22px;
        height: 22px;
        line-height: 22px;
        text-align: center;
        background: rgba(0,0,0,0.7);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        user-select: none;
        z-index: 10;
      }
      .sidebar-frame {
        width: 160px;
        height: 600px;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="gameContainer"></div>
  </body>
</html>
