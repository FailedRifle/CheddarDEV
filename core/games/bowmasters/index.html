<html lang="en">
<head>

    <meta charset="utf-8"/>
    <title>bowmasters</title>

    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-touch-fullscreen" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="msapplication-tap-highlight" content="no"/>
    <meta name="MobileOptimized" content="960"/>
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1.0, user-scalable=no, minimal-ui"/>

    <link rel="stylesheet" type="text/css" href="style/index.css" nonce="nDK4DWRLJoqf7mjw9cLs1g"/>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/youtube-playables@main/ytgame.js" nonce="nDK4DWRLJoqf7mjw9cLs1g"></script>
    <script src="game.js" nonce="nDK4DWRLJoqf7mjw9cLs1g"></script>
    
    <script nonce="nDK4DWRLJoqf7mjw9cLs1g">
        window.addEventListener("load", () => {
            try {
                const testKey = '__storage_test__';
                localStorage.setItem(testKey, testKey);
                localStorage.removeItem(testKey);
                console.log("Local storage is fully enabled and saving progress.");
            } catch (e) {
                console.warn("Local storage is restricted or disabled in this environment:", e);
            }

            // Run the game
            if (typeof window.runGame === 'function') {
                window.runGame();
            } else {
                console.error("runGame function is missing.");
            }
        });
    </script>

    <style>
        #sidebarad1,
        #sidebarad2 {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 600px;
            padding: 0;
            margin: 0;
            z-index: 999999;
        }
        #sidebarad1 {
            left: 0;
        }
        #sidebarad2 {
            right: 0;
        }
        .sidebar-close {
            position: absolute;
            top: 0;
            right: 0;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }
        .sidebar-frame {
            width: 160px;
            height: 600px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="game"></div>
</body>
</html>
